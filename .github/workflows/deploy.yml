name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
      - claude/dashboard-custom-hosting-ow4qhx
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: node scripts/seed-knowledge.mjs
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - run: node scripts/seed-supabase.mjs
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Fetch live stock & forex data
        continue-on-error: true
        run: node scripts/fetch-stock-data.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - run: npx opennextjs-cloudflare build
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set Cloudflare Worker runtime secrets
        continue-on-error: true
        run: |
          printf '%s' "$GROQ_API_KEY" | npx wrangler versions secret put GROQ_API_KEY
          printf '%s' "$SUPABASE_URL" | npx wrangler versions secret put NEXT_PUBLIC_SUPABASE_URL
          LAST_OUTPUT=$(printf '%s' "$SUPABASE_ANON_KEY" | npx wrangler versions secret put NEXT_PUBLIC_SUPABASE_ANON_KEY 2>&1)
          echo "$LAST_OUTPUT"
          VERSION_ID=$(echo "$LAST_OUTPUT" | grep -oP 'Created version \K[0-9a-f-]+')
          if [ -n "$VERSION_ID" ]; then
            echo "Deploying version $VERSION_ID with all secrets to production..."
            npx wrangler versions deploy "$VERSION_ID@100" --yes
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
